# Paper-scale template: the 1.5B student / 100B-token budget analyzed in the
# paper's compute section (Table 1). This is a *recipe template* -- wire in
# your own corpus and cluster. The `shimballm project --config` command prints
# the FLOPs projection for exactly this configuration.
#
#   shimballm project --config examples/student_1p5b_crop.yaml

model:
  arch: tiny                 # replace with an HF config or your own trainer bridge
  vocab_size: 49152
  d_model: 2048
  n_layers: 28
  n_heads: 16
  n_kv_heads: 4              # GQA (Llama-3.2 / Qwen2 style)
  ffn_mult: 4.0
  use_swiglu: true
  tie_embeddings: true
  max_seq_len: 4096

ref:
  arch: tiny
  vocab_size: 49152
  d_model: 1024
  n_layers: 12
  n_heads: 8
  ffn_mult: 4.0
  params_target: 0.3e9       # 0.3B scorer, 5x smaller than the student
  corpus_inflation: 1.4      # scoring pass covers 1.4x the token budget
  batch_size: 64

data:
  corpus: data/fineweb-edu.jsonl
  tokenizer: char            # replace with your tokenizer
  val_fraction: 0.005
  seed: 7
  cache_dir: cache/fineweb-edu-1p5b

crop:
  doc_drop_quantile: 0.30    # -15.4% FLOPs in the projection
  stage_b_doc_quantile: 0.50
  stage_c_doc_quantile: 0.80
  rho_start: 0.40
  rho_end: 0.10
  gate_enabled: true
  gate_gamma: 1.0e-5
  gate_patience: 2
  min_stage_fraction: 0.25

schedule:
  total_tokens: 100000000000   # 100B-token budget (D*)
  stage_shares: [0.55, 0.30, 0.15]
  warmup_fraction: 0.05
  peak_lr: 3.0e-4
  end_lr_fraction: 0.1
  context_start: 2048          # Stage A at 2K
  context_end: 4096            # ramp to 4K across Stage B
  batch_size: 128
  grad_accum: 8
  weight_decay: 0.1
  grad_clip: 1.0
  optimizer: muon              # ~2x efficiency vs AdamW (paper Lever 3)
  amp_dtype: bf16

engine:
  out_dir: runs/crop_1p5b_100b
  eval_every: 500
  eval_batches: 8
  log_every: 50
  seed: 0
  device: auto
  save_stable_ckpt: true

hub:
  org: ShimbaLLM
  repo_name: crop-1p5b-100b
  push_after_train: true
