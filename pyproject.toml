[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shimballm"
version = "0.1.0"
description = "ShimbaLLM: loss-gated data staging with selective token replay for compute-efficient small language model training (CROP recipe)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "ShimbaLLM" }]
keywords = [
  "small-language-models",
  "pretraining",
  "compute-efficient-training",
  "curriculum-learning",
  "selective-language-modeling",
  "wsd-schedule",
  "crop",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
hf = ["transformers>=4.40", "datasets>=2.19", "huggingface_hub>=0.23", "accelerate>=0.30"]
dev = ["pytest>=7.0"]

[project.scripts]
shimballm = "shimballm.cli:main"

[tool.setuptools.packages.find]
include = ["shimballm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
